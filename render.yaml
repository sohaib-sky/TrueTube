# Render blueprint — deploys TrueTube in one step.
#
# Render reads this from the repository root. Creating a Blueprint and pointing
# it at this file provisions the service with the settings below.
#
# Read this before assuming it will work perfectly: the Hobby tier is free but it
# idles out after 15 minutes, gives the container 512 MB of RAM, and gives the
# service a datacenter IP. That last point matters — YouTube refuses requests
# from datacenter ranges, so downloads from this deployment will often fail on
# YouTube specifically while working on TikTok, Facebook and similar sources.
# That is a property of the host, not a fault in this application.

services:
  - type: web
    name: truetube
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # How long Render waits for the app to answer before giving up on a deploy.
    # The first start compiles nothing but does probe yt-dlp and FFmpeg, so this
    # is generous on purpose.
    autoDeploy: true
    autoDeployTrigger: commit

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is deliberately NOT set here. Render assigns the port the service is
      # reachable on, and hardcoding 5000 makes the container listen somewhere
      # Render is not routing to — the deploy then fails with a port mismatch
      # that looks nothing like an application fault. The app reads PORT from the
      # environment, and only falls back to 5000 when it is unset.

      # Every limiter counts by client IP. Render forwards the real address in
      # X-Forwarded-For, so without this the whole internet counts as one address
      # and the first few downloads exhaust the shared bucket.
      - key: TRUST_PROXY
        value: "true"

      # Free instances are disposable, so keep the ceiling low enough that a
      # burst does not exhaust the shared per-IP bucket, while still allowing a
      # normal person several downloads in a row.
      - key: RATE_LIMIT_DOWNLOAD
        value: 20
      - key: RATE_LIMIT_ANALYZE
        value: 60
      - key: MAX_CONCURRENT_DOWNLOADS
        value: 2

      # Canonical tags, share images and the sitemap are built from this. It is
      # only a starting value: if Render hands you a different host (for example
      # truetube-abc12, because the plain name was already taken), set SITE_URL to
      # the address shown in the dashboard. Otherwise every canonical and OG link
      # points at a host that does not serve the site.
      - key: SITE_URL
        value: https://truetube.onrender.com
