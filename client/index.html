<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06070a" />
    <meta name="color-scheme" content="dark" />

    <!--
      Everything below this marker is generated per route by the server, from
      server/src/services/seoMeta.js, and re-applied by the client after a
      client-side navigation. The values here are the home page's and are only
      ever served for a JavaScript-less request: a crawler that executes the
      bundle gets the correct route-specific head from the server response
      instead, and an unknown path gets a real 404.
    -->
    <!--seo-head-->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #eef1f6; background: #06070a">
        <h1>TrueTube</h1>
        <p>TrueTube needs JavaScript enabled to analyze URLs and download media.</p>
        <p>
          TrueTube analyzes a supported video URL, shows the formats that source actually offers,
          and downloads the one you choose. It supports YouTube, TikTok, Facebook, Twitch and 20+
          other sources.
        </p>
        <p>
          <a href="/" style="color: #5eead4">TrueTube home</a> ·
          <a href="/privacy" style="color: #5eead4">Privacy</a> ·
          <a href="/terms" style="color: #5eead4">Terms</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
